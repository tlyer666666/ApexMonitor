name: Release

on:
  push:
    tags: ['v*']

jobs:
  checks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Core tests
        run: Scripts/test.sh

      - name: Process sampling (real libproc)
        run: bash Scripts/process-test.sh

      - name: Lifecycle, history and installer suites
        run: Scripts/integration-test.sh

  dmg:
    needs: checks
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so package-app.sh can derive the build number from
          # the commit count; a shallow clone would always report 1.
          fetch-depth: 0

      - name: Resolve version from tag
        run: echo "MACPULSE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build app bundle and DMG
        run: Scripts/make-dmg.sh

      - name: Generate SHA-256 checksums
        run: |
          (cd dist && shasum -a 256 MacPulse.dmg > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Upload DMG and checksum artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MacPulse-${{ github.ref_name }}
          path: |
            dist/MacPulse.dmg
            dist/SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MacPulse.dmg
            dist/SHA256SUMS.txt
          generate_release_notes: true
