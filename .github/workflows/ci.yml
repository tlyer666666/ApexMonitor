name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Core tests
        run: Scripts/test.sh

      - name: Process sampling (real libproc)
        run: bash Scripts/process-test.sh

      - name: Lifecycle, history and installer suites
        run: Scripts/integration-test.sh

      - name: System sensor smoke
        run: Scripts/smoke.sh

      - name: Package app bundle
        run: Scripts/package-app.sh

      - name: Lint Info.plist
        run: plutil -lint dist/MacPulse.app/Contents/Info.plist
