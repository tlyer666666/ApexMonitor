name: Release

on:
  push:
    tags: ['v*']

jobs:
  checks:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Core tests
        run: Scripts/test.sh

      - name: Process sampling (real libproc)
        run: bash Scripts/process-test.sh

      - name: Lifecycle, history and installer suites
        run: Scripts/integration-test.sh

  dmg:
    needs: checks
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from tag
        run: echo "MACPULSE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Package app bundle
        run: Scripts/package-app.sh

      - name: Build DMG
        run: Scripts/make-dmg.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacPulse-${{ github.ref_name }}.dmg
          path: dist/MacPulse.dmg

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MacPulse.dmg
          generate_release_notes: true
